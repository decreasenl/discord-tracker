[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "discord-tracker"
version = "0.1.0"
description = "Private OSRS community bot"
requires-python = ">=3.12"
dependencies = ["discord.py==2.6.4", "httpx==0.28.1", "python-dotenv==1.2.1", "tzdata==2025.3"]

[project.optional-dependencies]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0"]

[project.scripts]
discord-tracker = "discord_tracker.__main__:main"
tracker-admin = "discord_tracker.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
